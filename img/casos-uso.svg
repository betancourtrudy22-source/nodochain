<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240">
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <!-- Finanzas -->
    <circle cx="120" cy="90" r="60" fill="#0d1436" stroke="#00e5ff" stroke-width="2"/>
    <text x="120" y="80" font-size="34" fill="#00e5ff">$</text>
    <text x="120" y="105" font-size="11" fill="#c9d4ff">DeFi</text>
    <text x="120" y="175" fill="#c9d4ff" font-size="14">Finanzas</text>

    <!-- Cadena de suministro -->
    <circle cx="330" cy="90" r="60" fill="#0d1436" stroke="#7b5cff" stroke-width="2"/>
    <rect x="305" y="75" width="20" height="20" fill="none" stroke="#7b5cff" stroke-width="2"/>
    <rect x="335" y="75" width="20" height="20" fill="none" stroke="#7b5cff" stroke-width="2"/>
    <line x1="325" y1="85" x2="335" y2="85" stroke="#7b5cff" stroke-width="2"/>
    <text x="330" y="175" fill="#c9d4ff" font-size="14">Cadena de suministro</text>

    <!-- Salud -->
    <circle cx="560" cy="90" r="60" fill="#0d1436" stroke="#00e5ff" stroke-width="2"/>
    <path d="M545 90 h12 v-12 h6 v12 h12 v6 h-12 v12 h-6 v-12 h-12 z" fill="#00e5ff"/>
    <text x="560" y="175" fill="#c9d4ff" font-size="14">Salud</text>

    <!-- Votación -->
    <circle cx="780" cy="90" r="60" fill="#0d1436" stroke="#7b5cff" stroke-width="2"/>
    <rect x="758" y="70" width="44" height="34" rx="4" fill="none" stroke="#7b5cff" stroke-width="2"/>
    <polyline points="768,86 778,96 796,76" fill="none" stroke="#7b5cff" stroke-width="3"/>
    <text x="780" y="175" fill="#c9d4ff" font-size="14">Votación</text>
  </g>
</svg>
