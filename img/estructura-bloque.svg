<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <linearGradient id="blk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#182552"/>
      <stop offset="100%" stop-color="#0d1436"/>
    </linearGradient>
  </defs>
  <rect width="900" height="320" fill="none"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- Bloque anterior -->
    <rect x="30" y="90" width="190" height="140" rx="14" fill="url(#blk)" stroke="#3a4a8f" stroke-width="2"/>
    <text x="125" y="70" text-anchor="middle" fill="#9fb2ff" font-size="16" font-weight="700">Bloque N-1</text>
    <text x="55" y="120" fill="#8ea0e0" font-size="12">Hash anterior</text>
    <text x="55" y="150" fill="#00e5ff" font-size="11">0x7f...a3</text>
    <text x="55" y="180" fill="#8ea0e0" font-size="12">Transacciones</text>
    <text x="55" y="205" fill="#c9d4ff" font-size="11">Tx1, Tx2, Tx3...</text>

    <!-- Flecha -->
    <line x1="225" y1="160" x2="335" y2="160" stroke="#00e5ff" stroke-width="3"/>
    <polygon points="335,152 355,160 335,168" fill="#00e5ff"/>

    <!-- Bloque actual (resaltado) -->
    <rect x="360" y="70" width="210" height="180" rx="14" fill="url(#blk)" stroke="#00e5ff" stroke-width="3"/>
    <text x="465" y="50" text-anchor="middle" fill="#00e5ff" font-size="17" font-weight="700">Bloque N (actual)</text>
    <text x="385" y="100" fill="#8ea0e0" font-size="12">Hash anterior</text>
    <text x="385" y="122" fill="#00e5ff" font-size="11">0x9c...e1</text>
    <text x="385" y="150" fill="#8ea0e0" font-size="12">Marca de tiempo</text>
    <text x="385" y="172" fill="#c9d4ff" font-size="11">2026-09-22 10:41</text>
    <text x="385" y="200" fill="#8ea0e0" font-size="12">Transacciones + Nonce</text>
    <text x="385" y="222" fill="#c9d4ff" font-size="11">Tx4, Tx5... | nonce: 88214</text>

    <!-- Flecha -->
    <line x1="575" y1="160" x2="685" y2="160" stroke="#00e5ff" stroke-width="3"/>
    <polygon points="685,152 705,160 685,168" fill="#00e5ff"/>

    <!-- Bloque siguiente -->
    <rect x="710" y="90" width="170" height="140" rx="14" fill="url(#blk)" stroke="#3a4a8f" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="795" y="70" text-anchor="middle" fill="#9fb2ff" font-size="16" font-weight="700">Bloque N+1</text>
    <text x="735" y="120" fill="#8ea0e0" font-size="12">Hash anterior</text>
    <text x="735" y="145" fill="#00e5ff" font-size="11">0x9c...e1</text>
    <text x="735" y="175" fill="#8ea0e0" font-size="12">(por minar)</text>
  </g>
</svg>
